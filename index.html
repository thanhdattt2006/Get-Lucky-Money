<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tết 2026 - Lì Xì Cho Đạt điii 🧧" />
    <meta
      property="og:url"
      content="https://thanhdattt2006.github.io/Get-Lucky-Money/"
    />
    <meta
      property="og:description"
      content="Vòng quay gửi lộc. Lì xì cho em Đạt đi các nhà hảo tâm ơi!"
    />
    <meta
      property="og:image"
      content="https://thanhdattt2006.github.io/Get-Lucky-Money/resources/thumbnail.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tết 2026 - Lì Xì Cho Đạt" />
    <meta
      name="twitter:description"
      content="Vòng quay nhân phẩm. Vào đây lì xì cho tui."
    />
    <meta
      name="twitter:image"
      content="https://thanhdattt2006.github.io/Get-Lucky-Money/resources/thumbnail.png"
    />
    <title>Tết 2026 - Lì Xì Cho Đạt</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="video" href="resources/loop.mp4" type="video/mp4" />
    <link rel="shortcut icon" type="image/x-icon" href="resources/dave.png" />
    <link rel="stylesheet" href="resources/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <video autoplay muted loop playsinline id="bg-video">
      <source src="resources/loop.mp4" type="video/mp4" />
    </video>

    <audio id="bg-music" loop>
      <source src="resources/song.mp3" type="audio/mpeg" />
    </audio>

    <div class="music-control" onclick="app.toggleMusic()">
      <span id="music-icon">🔊</span>
    </div>

    <div class="overlay"></div>

    <div class="glass-panel">
      <div id="step-1">
        <h1>Lì Xì Tết 2026</h1>
        <p>Cho Đạt gửi lời chào năm mới đến mọi người!</p>
        <input
          type="text"
          id="username"
          placeholder="Quý nhân xin hãy cho Đạt biết tên"
          autocomplete="off"
        />
        <button class="btn-gold" onclick="app.start()">Vào Lì Xì</button>
      </div>

      <div id="step-2" class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
        <button
          id="spin-btn"
          class="btn-gold"
          style="margin-top: 25px"
          onclick="app.spin()"
        >
          Quay Vòng Gửi Lộc
        </button>
      </div>

      <div id="step-3" style="display: none">
        <h2
          id="congrats-text"
          style="color: var(--gold); margin-bottom: 10px"
        ></h2>
        <div class="qr-box">
          <img src="resources/qr.png" alt="QR Thanh Toán" id="qr-img" />
        </div>
        <p>Anh/chị vui lòng chuyển khoản để lì xì cho Đạt nha🙏</p>
        <button class="btn-gold" onclick="location.reload()">Quay lại</button>
      </div>
    </div>

    <script src="resources/js/main.js"></script>
  </body>
</html>
