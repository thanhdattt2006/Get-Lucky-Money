<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tết 2026 - Lì Xì Cho Đạt</title>
    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <!-- Libs -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
      :root {
        --primary: #c62828;
        --gold: #ffd700;
        --glass: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.3);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        color: #fff;
        position: relative;
      }

      /* --- VIDEO BACKGROUND --- */
      #bg-video {
        position: fixed;
        right: 0;
        bottom: 0;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        z-index: -2; /* Nằm dưới cùng */
        object-fit: cover;
      }

      /* Lớp phủ tối */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4); /* Tối hơn chút cho video đỡ loè loẹt */
        z-index: -1;
      }

      /* Panel Kính */
      .glass-panel {
        position: relative;
        z-index: 10;
        background: var(--glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 2px solid var(--glass-border);
        border-radius: 24px;
        padding: 40px 30px;
        width: 95%;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      h1 {
        color: var(--gold);
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        margin-bottom: 5px;
        font-weight: 900;
      }

      p {
        color: #eee;
        margin-bottom: 20px;
        font-weight: 500;
      }

      input {
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.9);
        font-size: 16px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 20px;
        outline: none;
        transition: 0.3s;
      }
      input:focus {
        border-color: var(--gold);
        box-shadow: 0 0 15px var(--gold);
      }

      .btn-gold {
        background: linear-gradient(45deg, #ffd700, #ffb300);
        color: #8b0000;
        border: none;
        padding: 15px 40px;
        border-radius: 50px;
        font-weight: 800;
        font-size: 1.1rem;
        cursor: pointer;
        width: 100%;
        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        text-transform: uppercase;
      }
      .btn-gold:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
      }
      .btn-gold:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .wheel-container {
        display: none;
        position: relative;
        margin-top: 20px;
      }

      .pointer {
        position: absolute;
        top: -25px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 50px;
        background: #c62828;
        clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
        z-index: 20;
        filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.5));
      }

      canvas {
        border-radius: 50%;
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        border: 8px solid var(--gold);
        transition: transform 8s cubic-bezier(0.25, 0.1, 0.25, 1);
        width: 100%;
        max-width: 350px;
        height: auto;
      }

      #result-screen {
        display: none;
      }
      .qr-box img {
        width: 220px;
        height: 220px;
        border-radius: 15px;
        border: 5px solid var(--gold);
        margin: 15px 0;
        background: #fff;
        padding: 5px;
      }

      #admin-panel {
        display: none;
        text-align: left;
        margin-top: 20px;
        max-height: 400px;
        overflow-y: auto;
      }
      .admin-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        overflow: hidden;
      }
      .admin-table th,
      .admin-table td {
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 0.9rem;
      }
      .admin-table th {
        background: rgba(255, 215, 0, 0.2);
        color: var(--gold);
      }
      .total-row {
        font-weight: bold;
        color: var(--gold);
        font-size: 1.1rem;
        padding: 15px;
        text-align: right;
      }

      .admin-link {
        position: absolute;
        bottom: 10px;
        right: 15px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.3);
        cursor: pointer;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <!-- 
      VIDEO BACKGROUND
      Mày thay src="video.mp4" bằng file video của mày nhé. 
      Thuộc tính: autoplay (tự chạy), muted (tắt tiếng video để ko đấm nhau với nhạc nền), loop (lặp lại)
    -->
    <video autoplay muted loop playsinline id="bg-video">
      <source
        src="https://joy1.videvo.net/videvo_files/converted/2017_12/preview/171124_H1_006.mp4"
        type="video/mp4"
      />
    </video>

    <!-- 
      AUDIO NHẠC TẾT
      Thay src="nhac-tet.mp3" bằng link nhạc của mày
    -->
    <audio id="bg-music" loop>
      <source
        src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
        type="audio/mpeg"
      />
    </audio>

    <div class="overlay"></div>

    <div class="glass-panel">
      <!-- Màn hình 1 -->
      <div id="step-1">
        <h1>Lì Xì Tết 2026</h1>
        <p>Vòng quay nhân phẩm - Lì xì cho Đạt nha!</p>
        <input
          type="text"
          id="username"
          placeholder="Nhập tên người lì xì..."
          autocomplete="off"
        />
        <button class="btn-gold" onclick="app.start()">Vào Việc Ngay</button>
      </div>

      <!-- Màn hình 2 -->
      <div id="step-2" class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
        <button
          id="spin-btn"
          class="btn-gold"
          style="margin-top: 25px"
          onclick="app.spin()"
        >
          Quay Tay Chốt Lộc
        </button>
      </div>

      <!-- Màn hình 3 -->
      <div id="step-3" id="result-screen" style="display: none">
        <h2
          id="congrats-text"
          style="color: var(--gold); margin-bottom: 10px"
        ></h2>
        <div class="qr-box">
          <img
            src="images/qr.png"
            alt="QR Thanh Toán"
            id="qr-img"
            onerror="
              this.src = 'https://via.placeholder.com/220x220?text=QR+IMG+Loi'
            "
          />
        </div>
        <p>Quét mã bank luôn cho nóng nhé! 🎉</p>
        <button class="btn-gold" onclick="location.reload()">
          Chơi lại (Đừng hòng thoát)
        </button>
      </div>

      <!-- Admin Panel -->
      <div id="admin-panel">
        <h3
          style="
            color: var(--gold);
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
          "
        >
          Danh sách người Lì Xì
        </h3>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Tên</th>
              <th>Tiền (VNĐ)</th>
            </tr>
          </thead>
          <tbody id="admin-list"></tbody>
        </table>
        <div class="total-row" id="admin-total">Tổng thu: 0đ</div>
        <button
          style="
            margin-top: 10px;
            padding: 5px 15px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          "
          onclick="location.reload()"
        >
          Back
        </button>
      </div>
    </div>

    <div class="admin-link" onclick="app.openAdmin()">Admin Login</div>

    <script>
      const API_URL = 'https://68edcae6df2025af780116cf.mockapi.io/luckyMoney';

      const CONFIG = {
        slices: [
          { v: 10000, l: '10K' }, // 0
          { v: 200000, l: '200K' }, // 1
          { v: 10000, l: '10K' }, // 2
          { v: 200000, l: '200K' }, // 3
          { v: 10000, l: '10K' }, // 4
          { v: 500000, l: '500K' }, // 5 (Giải to)
          { v: 10000, l: '10K' }, // 6
          { v: 200000, l: '200K' }, // 7
          { v: 100000, l: '100K' }, // 8
          { v: 10000, l: '10K' }, // 9
        ],
        colors: ['#c62828', '#ffd700'],
        textColors: ['#fff', '#c62828'],
      };

      const app = {
        user: null,
        canvas: document.getElementById('wheel'),
        ctx: document.getElementById('wheel').getContext('2d'),
        rotation: 0,
        audio: document.getElementById('bg-music'),

        // Init: Cố gắng phát nhạc khi load
        init() {
          // Cái này hên xui tùy trình duyệt
          this.audio.volume = 0.5;
          this.audio.play().catch(() => {
            console.log('Chặn autoplay rồi, chờ user click thôi');
          });
        },

        drawWheel() {
          const arc = (2 * Math.PI) / CONFIG.slices.length;
          const ctx = this.ctx;
          CONFIG.slices.forEach((item, i) => {
            const angle = i * arc;
            ctx.beginPath();
            ctx.fillStyle = CONFIG.colors[i % 2];
            ctx.moveTo(200, 200);
            ctx.arc(200, 200, 200, angle, angle + arc);
            ctx.lineTo(200, 200);
            ctx.fill();

            ctx.save();
            ctx.translate(200, 200);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = 'right';
            ctx.fillStyle = CONFIG.textColors[i % 2];
            ctx.font = 'bold 24px Inter';
            ctx.fillText(item.l, 180, 8);
            ctx.restore();
          });

          ctx.beginPath();
          ctx.arc(200, 200, 25, 0, 2 * Math.PI);
          ctx.fillStyle = '#fff';
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#c62828';
          ctx.stroke();

          ctx.fillStyle = '#c62828';
          ctx.font = 'bold 12px Inter';
          ctx.textAlign = 'center';
          ctx.fillText('TẾT', 200, 204);
        },

        async start() {
          const nameInput = document.getElementById('username');
          const name = nameInput.value.trim();

          // Kích hoạt nhạc ngay khi user click nút này (Bypass Autoplay Policy)
          this.audio.play().catch((e) => console.log(e));

          if (!name)
            return Swal.fire(
              'Ê!',
              'Không nhập tên sao biết ai lì xì?',
              'warning',
            );

          try {
            const res = await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                name: name,
                money: 0,
                date: new Date().toISOString(),
              }),
            });
            this.user = await res.json();

            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
            this.drawWheel();
          } catch (e) {
            Swal.fire('Lỗi mạng', 'Check lại API đi bạn êi.', 'error');
          }
        },

        async spin() {
          const btn = document.getElementById('spin-btn');
          btn.disabled = true;
          btn.innerText = 'Đang quay...';

          // --- CHEAT MODE: 60 - 33 - 6 - 1 ---
          let finalMoney;
          const rand = Math.random() * 100;

          if (rand < 60)
            finalMoney = 200000; // 60%
          else if (rand < 93)
            finalMoney = 500000; // 33%
          else if (rand < 99)
            finalMoney = 100000; // 6%
          else finalMoney = 10000; // 1%

          // Logic tìm góc quay
          const possibleIndices = CONFIG.slices
            .map((s, i) => (s.v === finalMoney ? i : -1))
            .filter((i) => i !== -1);
          const targetIndex =
            possibleIndices[Math.floor(Math.random() * possibleIndices.length)];

          // Tính toán rotation (Gốc 270 độ là 12h)
          const sliceDeg = 360 / CONFIG.slices.length;
          const targetSliceCenter = targetIndex * sliceDeg + sliceDeg / 2;
          let rotateAngle = 270 - targetSliceCenter;
          while (rotateAngle < 0) rotateAngle += 360;

          // Quay tối thiểu 8 vòng
          const extraSpins = 360 * 8;
          const currentMod = this.rotation % 360;
          let distance = rotateAngle - currentMod;
          if (distance < 0) distance += 360;

          this.rotation += distance + extraSpins;
          this.canvas.style.transform = `rotate(${this.rotation}deg)`;

          setTimeout(async () => {
            await this.finishSpin(finalMoney);
          }, 8000);
        },

        async finishSpin(money) {
          try {
            await fetch(`${API_URL}/${this.user.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ money: money }),
            });
          } catch (e) {}

          confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#ffd700', '#c62828'],
          });

          document.getElementById('step-2').style.display = 'none';
          document.getElementById('step-3').style.display = 'block';

          document.getElementById('congrats-text').innerHTML =
            `Chúc mừng <b>${this.user.name}</b>!<br/>Bạn đã lì xì cho Đạt <b>${money.toLocaleString()}đ</b> 🎊`;

          // Cập nhật QR Code (API)
          // Link này sẽ tạo QR chứa nội dung chuyển khoản
          const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=Dat_Lixi_${money}_tu_${this.user.name}`;
          // document.getElementById('qr-img').src = qrUrl; // Uncomment nếu muốn QR động
        },

        async openAdmin() {
          const { value: password } = await Swal.fire({
            title: 'Admin Access',
            input: 'password',
            inputPlaceholder: 'Nhập mật khẩu (1234)',
            background: '#fff',
            confirmButtonColor: '#c62828',
          });

          if (password === '1234') {
            document
              .querySelectorAll('.glass-panel > div')
              .forEach((d) => (d.style.display = 'none'));
            document.getElementById('admin-panel').style.display = 'block';
            this.loadAdminData();
          } else if (password) {
            Swal.fire('Sai pass!', 'Đừng hack nữa bạn ơi.', 'error');
          }
        },

        async loadAdminData() {
          const tbody = document.getElementById('admin-list');
          const totalEl = document.getElementById('admin-total');
          tbody.innerHTML = '<tr><td colspan="2">Đang tải...</td></tr>';

          try {
            const res = await fetch(API_URL);
            const data = await res.json();
            const validData = data.sort((a, b) => b.id - a.id);
            let total = 0;
            let html = '';

            validData.forEach((u) => {
              const m = parseInt(u.money) || 0;
              total += m;
              html += `<tr><td>${u.name}</td><td style="color: var(--gold); font-weight:bold">${m.toLocaleString()}đ</td></tr>`;
            });

            tbody.innerHTML =
              html || '<tr><td colspan="2">Chưa ai chơi cả :(</td></tr>';
            totalEl.innerHTML = `Tổng thu: ${total.toLocaleString()} VNĐ`;
          } catch (e) {
            tbody.innerHTML = '<tr><td colspan="2">Lỗi tải dữ liệu</td></tr>';
          }
        },
      };

      // Chạy thử autoplay khi load trang
      window.onload = () => app.init();
    </script>
  </body>
</html>
