<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tết 2026 - Lì Xì Cho Đạt</title>
    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <!-- Libs -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  </head>
  <body>
    <!-- 
      VIDEO BACKGROUND
      Mày thay src="video.mp4" bằng file video của mày nhé. 
      Thuộc tính: autoplay (tự chạy), muted (tắt tiếng video để ko đấm nhau với nhạc nền), loop (lặp lại)
    -->
    <video autoplay muted loop playsinline id="bg-video">
      <source src="resources/loop.mp4" type="video/mp4" />
    </video>

    <!-- 
      AUDIO NHẠC TẾT
      Thay src="nhac-tet.mp3" bằng link nhạc của mày
    -->
    <audio id="bg-music" loop>
      <source src="resources/song.mp3" type="audio/mpeg" />
    </audio>

    <div class="overlay"></div>

    <div class="glass-panel">
      <!-- Màn hình 1 -->
      <div id="step-1">
        <h1>Lì Xì Tết 2026</h1>
        <p>Vòng quay nhân phẩm - Lì xì cho Đạt nha!</p>
        <input
          type="text"
          id="username"
          placeholder="Nhập tên người lì xì..."
          autocomplete="off"
        />
        <button class="btn-gold" onclick="app.start()">Vào Việc Ngay</button>
      </div>

      <!-- Màn hình 2 -->
      <div id="step-2" class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
        <button
          id="spin-btn"
          class="btn-gold"
          style="margin-top: 25px"
          onclick="app.spin()"
        >
          Quay Tay Chốt Lộc
        </button>
      </div>

      <!-- Màn hình 3 -->
      <div id="step-3" id="result-screen" style="display: none">
        <h2
          id="congrats-text"
          style="color: var(--gold); margin-bottom: 10px"
        ></h2>
        <div class="qr-box">
          <img src="resources/qr.png" alt="QR Thanh Toán" id="qr-img" />
        </div>
        <p>Quét mã bank luôn cho nóng nhé! 🎉</p>
        <button class="btn-gold" onclick="location.reload()">
          Chơi lại (Đừng hòng thoát)
        </button>
      </div>

      <!-- Admin Panel -->
      <div id="admin-panel">
        <h3
          style="
            color: var(--gold);
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
          "
        >
          Danh sách người Lì Xì
        </h3>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Tên</th>
              <th>Tiền (VNĐ)</th>
            </tr>
          </thead>
          <tbody id="admin-list"></tbody>
        </table>
        <div class="total-row" id="admin-total">Tổng thu: 0đ</div>
        <button
          style="
            margin-top: 10px;
            padding: 5px 15px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          "
          onclick="location.reload()"
        >
          Back
        </button>
      </div>
    </div>

    <div class="admin-link" onclick="app.openAdmin()">Admin Login</div>
    <script src="main.js"></script>
  </body>
</html>
