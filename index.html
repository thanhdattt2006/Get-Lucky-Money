<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tết 2026 - Lì Xì Cho Đạt</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        background: linear-gradient(135deg, #c62828 0%, #8b0000 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
      }

      /* Particles hoa mai vàng bay */
      .particle {
        position: absolute;
        width: 10px;
        height: 10px;
        background: radial-gradient(circle, #ffd700 0%, #ffb300 100%);
        border-radius: 50%;
        opacity: 0.8;
        animation: fall linear infinite;
        pointer-events: none;
      }

      @keyframes fall {
        0% {
          transform: translateY(-100vh) rotate(0deg);
          opacity: 0.9;
        }
        100% {
          transform: translateY(100vh) rotate(360deg);
          opacity: 0;
        }
      }

      /* Decor cây mai góc phải */
      .decor-mai {
        position: absolute;
        top: -20px;
        right: -50px;
        width: 350px;
        opacity: 0.15;
        pointer-events: none;
        z-index: 1;
        animation: sway 4s ease-in-out infinite;
      }

      @keyframes sway {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(3deg);
        }
      }

      /* Container chính */
      .container {
        background: rgba(255, 255, 255, 0.98);
        border-radius: 30px;
        padding: 40px 30px;
        width: 95%;
        max-width: 480px;
        text-align: center;
        position: relative;
        z-index: 10;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
        animation: slideIn 0.6s ease-out;
        border: 4px solid #ffd700;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Header với icon */
      .header-icon {
        font-size: 4rem;
        margin-bottom: 10px;
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      h1 {
        color: #c62828;
        font-size: 1.8rem;
        font-weight: 800;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 2px 2px 4px rgba(198, 40, 40, 0.2);
      }

      .subtitle {
        color: #666;
        font-size: 0.95rem;
        margin-bottom: 25px;
        font-weight: 500;
      }

      /* Input field */
      input {
        width: 100%;
        padding: 16px 20px;
        border-radius: 15px;
        border: 2px solid #e0e0e0;
        margin-bottom: 20px;
        font-size: 1rem;
        font-weight: 600;
        text-align: center;
        background: #f8f9fa;
        color: #333;
        transition: all 0.3s ease;
        font-family: 'Inter', sans-serif;
      }

      input:focus {
        outline: none;
        border-color: #ffd700;
        background: #fff;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
      }

      /* Button chính */
      button {
        background: linear-gradient(135deg, #ffd700 0%, #ffb300 100%);
        color: #8b0000;
        border: none;
        padding: 16px 40px;
        border-radius: 50px;
        font-weight: 800;
        cursor: pointer;
        width: 100%;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: 0 8px 20px rgba(255, 179, 0, 0.4);
        position: relative;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
      }

      button::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
      }

      button:hover::before {
        width: 300px;
        height: 300px;
      }

      button:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(255, 179, 0, 0.5);
      }

      button:active {
        transform: translateY(-1px);
      }

      button:disabled {
        background: linear-gradient(135deg, #bdbdbd 0%, #9e9e9e 100%);
        cursor: not-allowed;
        box-shadow: none;
        color: #666;
      }

      /* Vòng quay */
      #wheel-container {
        display: none;
        margin-top: 30px;
        position: relative;
      }

      .wheel-wrap {
        border: 12px solid #ffd700;
        border-radius: 50%;
        display: inline-block;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3),
          0 0 0 20px rgba(255, 215, 0, 0.15);
        background: #ffd700;
        position: relative;
        animation: glow 2s ease-in-out infinite;
      }

      @keyframes glow {
        0%,
        100% {
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3),
            0 0 0 20px rgba(255, 215, 0, 0.15), 0 0 30px rgba(255, 215, 0, 0.4);
        }
        50% {
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3),
            0 0 0 20px rgba(255, 215, 0, 0.25), 0 0 50px rgba(255, 215, 0, 0.6);
        }
      }

      canvas {
        display: block;
        border-radius: 50%;
        transition: transform 8s cubic-bezier(0.2, 0, 0.1, 1);
      }

      /* Kim chỉ */
      .pointer {
        position: absolute;
        top: -35px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-top: 50px solid #c62828;
        z-index: 20;
        filter: drop-shadow(0 5px 10px rgba(198, 40, 40, 0.5));
        animation: pointerBounce 1s ease-in-out infinite;
      }

      @keyframes pointerBounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(5px);
        }
      }

      /* Kết quả */
      #qr-result {
        display: none;
        margin-top: 25px;
        animation: fadeIn 0.5s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      #congrats-text {
        color: #c62828;
        margin-bottom: 20px;
        font-size: 1.2rem;
        font-weight: 700;
        line-height: 1.6;
      }

      #qr-code img {
        border: 8px solid #ffd700;
        border-radius: 20px;
        width: 220px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease;
      }

      #qr-code img:hover {
        transform: scale(1.05);
      }

      .footer-text {
        margin-top: 20px;
        color: #666;
        font-weight: 600;
        font-size: 0.9rem;
      }

      /* Responsive cho mobile */
      @media (max-width: 600px) {
        .container {
          padding: 30px 20px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .wheel-wrap {
          transform: scale(0.8);
        }

        .decor-mai {
          width: 250px;
          opacity: 0.1;
        }
      }

      @media (max-width: 400px) {
        .wheel-wrap {
          transform: scale(0.65);
        }

        canvas {
          width: 300px !important;
          height: 300px !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Particles hoa mai bay -->
    <script src="main.js"></script>

    <img
      src="https://i.imgur.com/rM7pW2k.png"
      class="decor-mai"
      alt="Mai Vàng"
    />

    <div class="container">
      <div id="step-name">
        <div class="header-icon">🧧</div>
        <h1>Lì Xì Tết 2026</h1>
        <p class="subtitle">Chúc mừng năm mới, vạn sự như ý!</p>
        <input type="text" id="username" placeholder="Nhập tên của bạn..." />
        <button onclick="startApp()">Bắt Đầu Nhận Lộc</button>
      </div>

      <div id="wheel-container">
        <div class="wheel-wrap">
          <div class="pointer"></div>
          <canvas id="wheel" width="400" height="400"></canvas>
        </div>
        <button id="spin-btn" style="margin-top: 25px" onclick="spinWheel()">
          Quay Vòng May Mắn
        </button>
      </div>

      <div id="qr-result">
        <h2 id="congrats-text"></h2>
        <div id="qr-code"></div>
        <p class="footer-text">Chụp màn hình và gửi cho Đạt nhé! 🎉</p>
      </div>
    </div>

    <script>
      const API_URL = 'https://68edcae6df2025af780116cf.mockapi.io/luckyMoney';
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');

      let currentUser = null;
      let currentRotation = 0;

      // Danh sách giải thưởng (10 ô)
      const slices = [
        { v: 10000, l: '10K' },
        { v: 200000, l: '200K' },
        { v: 10000, l: '10K' },
        { v: 200000, l: '200K' },
        { v: 10000, l: '10K' },
        { v: 500000, l: '500K' },
        { v: 10000, l: '10K' },
        { v: 200000, l: '200K' },
        { v: 100000, l: '100K' },
        { v: 10000, l: '10K' },
      ];

      // Vẽ vòng quay với màu đỏ vàng Tết
      function drawWheel() {
        const arc = (2 * Math.PI) / slices.length;
        slices.forEach((s, i) => {
          const angle = i * arc;
          // Màu xen kẽ đỏ - vàng truyền thống
          ctx.fillStyle = i % 2 === 0 ? '#c62828' : '#ffd700';
          ctx.beginPath();
          ctx.moveTo(200, 200);
          ctx.arc(200, 200, 200, angle, angle + arc);
          ctx.fill();

          // Viền trắng ngăn cách
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 3;
          ctx.stroke();

          // Text giải thưởng
          ctx.save();
          ctx.translate(200, 200);
          ctx.rotate(angle + arc / 2);
          ctx.fillStyle = i % 2 === 0 ? '#fff' : '#8b0000';
          ctx.font = 'bold 20px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(s.l, 100, 8);
          ctx.restore();
        });

        // Tâm vòng quay
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(200, 200, 30, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 5;
        ctx.stroke();
      }

      // Bắt đầu app
      async function startApp() {
        const name = document.getElementById('username').value.trim();
        if (!name) {
          Swal.fire({
            icon: 'warning',
            title: 'Chờ đã!',
            text: 'Bạn chưa nhập tên kìa!',
            confirmButtonColor: '#c62828',
          });
          return;
        }

        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, money: 0 }),
          });
          currentUser = await res.json();

          document.getElementById('step-name').style.display = 'none';
          document.getElementById('wheel-container').style.display = 'block';
          drawWheel();
        } catch (e) {
          Swal.fire({
            icon: 'error',
            title: 'Lỗi rồi!',
            text: 'Không kết nối được server, thử lại nhé!',
            confirmButtonColor: '#c62828',
          });
        }
      }

      // Logic quay (giữ nguyên)
      async function spinWheel() {
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;

        // Quyết định giải thưởng trước
        let finalMoney;
        const rand = Math.random() * 100;
        if (rand < 95) finalMoney = 200000; // 95% ra 200k
        else if (rand < 98) finalMoney = 500000; // 3% ra 500k
        else if (rand < 99) finalMoney = 100000; // 1% ra 100k
        else finalMoney = 10000; // 1% ra 10k

        // Tìm ô có giá trị này
        const matchedIndices = slices
          .map((s, i) => (s.v === finalMoney ? i : -1))
          .filter((i) => i !== -1);
        const targetIndex =
          matchedIndices[Math.floor(Math.random() * matchedIndices.length)];

        // Tính góc quay để kim chỉ đúng
        const sliceDeg = 360 / slices.length;
        const extraDeg = 8 * 360; // Quay 8 vòng
        const stopDeg = 270 - targetIndex * sliceDeg - sliceDeg / 2;

        currentRotation +=
          extraDeg + ((stopDeg - (currentRotation % 360) + 360) % 360);
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        // Chờ 11s (8s quay + 3s dừng)
        setTimeout(async () => {
          // Update API
          await fetch(`${API_URL}/${currentUser.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ money: finalMoney }),
          });

          // Hiệu ứng pháo hoa vàng đỏ
          confetti({
            particleCount: 200,
            spread: 100,
            origin: { y: 0.6 },
            colors: ['#c62828', '#ffd700', '#ffb300'],
          });

          setTimeout(() => {
            confetti({
              particleCount: 150,
              spread: 80,
              origin: { y: 0.7 },
              colors: ['#c62828', '#ffd700'],
            });
          }, 300);

          // Hiện kết quả
          document.getElementById('wheel-container').style.display = 'none';
          document.getElementById('qr-result').style.display = 'block';
          document.getElementById('congrats-text').innerHTML = `Chúc mừng <b>${
            currentUser.name
          }</b>!<br/>Bạn đã lì xì cho Đạt <b>${finalMoney.toLocaleString()}đ</b> 🎊`;

          // Gen QR code
          const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=Dat_Lixi_${finalMoney}_tu_${currentUser.name}`;
          document.getElementById(
            'qr-code',
          ).innerHTML = `<img src="${qrUrl}" alt="QR Code"/>`;

          Swal.fire({
            icon: 'success',
            title: 'Hoàn thành!',
            html: `Cảm ơn bạn đã lì xì cho Đạt <b>${finalMoney.toLocaleString()}đ</b>!<br/>Chúc bạn năm mới an khang thịnh vượng! 🧧`,
            confirmButtonText: 'Đóng',
            confirmButtonColor: '#c62828',
          });
        }, 11000);
      }
    </script>
  </body>
</html>
