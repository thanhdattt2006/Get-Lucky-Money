<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tết 2026 - Lì Xì Cho Đạt</title>
    <!-- Font ngon lành -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <!-- Libs cũ giữ nguyên -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
      :root {
        --primary: #c62828; /* Đỏ */
        --gold: #ffd700; /* Vàng */
        --glass: rgba(255, 255, 255, 0.15); /* Màu kính trong suốt */
        --glass-border: rgba(255, 255, 255, 0.3);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
      }

      body {
        /* Thay cái url này bằng đường dẫn file img1.png (gif) của mày */
        background: url('img1.png') no-repeat center center fixed;
        background-size: cover;
        /* Fallback nếu ảnh lỗi thì hiện gradient */
        background-color: #8b0000;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
        color: #fff;
      }

      /* Lớp phủ tối màu để text dễ đọc hơn trên nền gif động */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.3);
        z-index: 0;
      }

      /* Container chính hiệu ứng kính mờ (Glassmorphism) */
      .glass-panel {
        position: relative;
        z-index: 10;
        background: var(--glass);
        backdrop-filter: blur(12px); /* Làm mờ nền sau lưng */
        -webkit-backdrop-filter: blur(12px);
        border: 2px solid var(--glass-border);
        border-radius: 24px;
        padding: 40px 30px;
        width: 95%;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      h1 {
        color: var(--gold);
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        margin-bottom: 5px;
        font-weight: 900;
      }

      p {
        color: #eee;
        margin-bottom: 20px;
        font-weight: 500;
      }

      /* Input đẹp hơn */
      input {
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.9);
        font-size: 16px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 20px;
        outline: none;
        transition: 0.3s;
      }
      input:focus {
        border-color: var(--gold);
        box-shadow: 0 0 15px var(--gold);
      }

      /* Button Gradient xịn */
      .btn-gold {
        background: linear-gradient(45deg, #ffd700, #ffb300);
        color: #8b0000;
        border: none;
        padding: 15px 40px;
        border-radius: 50px;
        font-weight: 800;
        font-size: 1.1rem;
        cursor: pointer;
        width: 100%;
        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        text-transform: uppercase;
      }
      .btn-gold:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
      }
      .btn-gold:active {
        transform: scale(0.98);
      }
      .btn-gold:disabled {
        background: #ccc;
        cursor: not-allowed;
        box-shadow: none;
      }

      /* Vòng quay wrapper */
      .wheel-container {
        display: none; /* Ẩn mặc định */
        position: relative;
        margin-top: 20px;
      }

      /* Cái kim chỉ - Tao làm đẹp hơn chút */
      .pointer {
        position: absolute;
        top: -25px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 50px;
        background: #c62828;
        clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
        z-index: 20;
        filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.5));
      }

      canvas {
        border-radius: 50%;
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        border: 8px solid var(--gold);
        transition: transform 8s cubic-bezier(0.25, 0.1, 0.25, 1); /* Easing mượt */
        width: 100%;
        max-width: 350px;
        height: auto;
      }

      /* Kết quả & QR */
      #result-screen {
        display: none;
      }
      .qr-box img {
        width: 220px;
        height: 220px;
        border-radius: 15px;
        border: 5px solid var(--gold);
        margin: 15px 0;
        background: #fff;
        padding: 5px; /* Để background trắng cho QR dễ scan */
      }

      /* Admin Section */
      #admin-panel {
        display: none;
        text-align: left;
        margin-top: 20px;
        max-height: 400px;
        overflow-y: auto;
      }
      .admin-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        overflow: hidden;
      }
      .admin-table th,
      .admin-table td {
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 0.9rem;
      }
      .admin-table th {
        background: rgba(255, 215, 0, 0.2);
        color: var(--gold);
      }
      .total-row {
        font-weight: bold;
        color: var(--gold);
        font-size: 1.1rem;
        padding: 15px;
        text-align: right;
      }

      /* Footer link */
      .admin-link {
        position: absolute;
        bottom: 10px;
        right: 15px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.3);
        cursor: pointer;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div class="overlay"></div>
    <!-- Lớp nền tối -->

    <div class="glass-panel">
      <!-- Màn hình 1: Nhập tên -->
      <div id="step-1">
        <div
          style="
            font-size: 4rem;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
          "
        >
          🧧
        </div>
        <h1>Lì Xì Tết 2026</h1>
        <p>Vòng quay nhân phẩm - Chốt đơn lì xì</p>
        <input
          type="text"
          id="username"
          placeholder="Nhập tên đại gia..."
          autocomplete="off"
        />
        <button class="btn-gold" onclick="app.start()">Vào Việc Ngay</button>
      </div>

      <!-- Màn hình 2: Vòng quay -->
      <div id="step-2" class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
        <button
          id="spin-btn"
          class="btn-gold"
          style="margin-top: 25px"
          onclick="app.spin()"
        >
          Quay Tay Vận May
        </button>
      </div>

      <!-- Màn hình 3: Kết quả -->
      <div id="step-3" id="result-screen" style="display: none">
        <h2
          id="congrats-text"
          style="color: var(--gold); margin-bottom: 10px"
        ></h2>
        <div class="qr-box">
          <!-- Thay src bằng qr.png của mày -->
          <img
            src="qr.png"
            alt="QR Thanh Toán"
            id="qr-img"
            onerror="
              this.src = 'https://via.placeholder.com/220x220?text=QR+IMG+Loi'
            "
          />
        </div>
        <p>Quét mã bank luôn cho nóng nhé! 🎉</p>
        <button class="btn-gold" onclick="location.reload()">
          Chơi lại (Chắc k ai chơi lại)
        </button>
      </div>

      <!-- Màn hình 4: Admin (Ẩn) -->
      <div id="admin-panel">
        <h3
          style="
            color: var(--gold);
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
          "
        >
          Danh sách Lì Xì
        </h3>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Tên</th>
              <th>Tiền (VNĐ)</th>
            </tr>
          </thead>
          <tbody id="admin-list"></tbody>
        </table>
        <div class="total-row" id="admin-total">Tổng thu: 0đ</div>
        <button
          style="
            margin-top: 10px;
            padding: 5px 15px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          "
          onclick="location.reload()"
        >
          Back
        </button>
      </div>
    </div>

    <div class="admin-link" onclick="app.openAdmin()">Admin Login</div>

    <script>
      // Config MockAPI - Mày nhớ check lại xem link này sống không nhé
      const API_URL = 'https://68edcae6df2025af780116cf.mockapi.io/luckyMoney';

      // Cấu hình vòng quay
      const CONFIG = {
        slices: [
          { v: 10000, l: '10K' },
          { v: 200000, l: '200K' },
          { v: 10000, l: '10K' },
          { v: 500000, l: '500K' }, // Giải to
          { v: 20000, l: '20K' },
          { v: 50000, l: '50K' },
          { v: 10000, l: '10K' },
          { v: 100000, l: '100K' },
        ],
        colors: ['#c62828', '#ffd700'], // Đỏ - Vàng
        textColors: ['#fff', '#c62828'],
      };

      const app = {
        user: null,
        canvas: document.getElementById('wheel'),
        ctx: document.getElementById('wheel').getContext('2d'),
        rotation: 0,

        // Vẽ vòng quay (Code tối ưu visual)
        drawWheel() {
          const arc = (2 * Math.PI) / CONFIG.slices.length;
          const ctx = this.ctx;

          CONFIG.slices.forEach((item, i) => {
            const angle = i * arc;

            // Vẽ miếng pizza
            ctx.beginPath();
            ctx.fillStyle = CONFIG.colors[i % 2];
            ctx.moveTo(200, 200);
            ctx.arc(200, 200, 200, angle, angle + arc);
            ctx.lineTo(200, 200);
            ctx.fill();

            // Vẽ text
            ctx.save();
            ctx.translate(200, 200);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = 'right';
            ctx.fillStyle = CONFIG.textColors[i % 2];
            ctx.font = 'bold 24px Inter';
            ctx.fillText(item.l, 180, 8); // Đẩy text ra sát viền
            ctx.restore();
          });

          // Vẽ tâm vòng quay (trang trí)
          ctx.beginPath();
          ctx.arc(200, 200, 25, 0, 2 * Math.PI);
          ctx.fillStyle = '#fff';
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#c62828';
          ctx.stroke();

          // Chữ giữa tâm
          ctx.fillStyle = '#c62828';
          ctx.font = 'bold 12px Inter';
          ctx.textAlign = 'center';
          ctx.fillText('TẾT', 200, 204);
        },

        // Bước 1: Nhập tên & Init User
        async start() {
          const nameInput = document.getElementById('username');
          const name = nameInput.value.trim();

          if (!name)
            return Swal.fire(
              'Ê!',
              'Không nhập tên sao biết ai lì xì?',
              'warning',
            );

          try {
            // Tạo user trên API
            const res = await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                name: name,
                money: 0,
                date: new Date().toISOString(),
              }),
            });
            this.user = await res.json();

            // Chuyển màn hình
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
            this.drawWheel();
          } catch (e) {
            Swal.fire(
              'Lỗi mạng',
              'API chết rồi hoặc mạng lag. F5 lại đi.',
              'error',
            );
          }
        },

        // Bước 2: Quay
        async spin() {
          const btn = document.getElementById('spin-btn');
          btn.disabled = true;
          btn.innerText = 'Đang quay...';

          // Logic Random (Tỉ lệ ra tiền to thấp thôi nhé)
          // 70% ra 10k/20k, 25% ra 50k/100k, 5% ra 200k/500k
          const rand = Math.random();
          let prizeMoney;

          if (rand < 0.7)
            prizeMoney = [10000, 20000][Math.floor(Math.random() * 2)];
          else if (rand < 0.95)
            prizeMoney = [50000, 100000][Math.floor(Math.random() * 2)];
          else prizeMoney = [200000, 500000][Math.floor(Math.random() * 2)];

          // Tìm vị trí ô có giá trị prizeMoney
          // Lọc ra các index có giá trị trùng khớp
          const possibleIndices = CONFIG.slices
            .map((s, i) => (s.v === prizeMoney ? i : -1))
            .filter((i) => i !== -1);

          // Chọn ngẫu nhiên 1 ô trong các ô trùng khớp
          const targetIndex =
            possibleIndices[Math.floor(Math.random() * possibleIndices.length)];

          // Tính toán góc quay
          const sliceDeg = 360 / CONFIG.slices.length;
          // Quay ít nhất 5 vòng (1800 độ) + góc tới ô đích
          // Offset thêm 1 chút để kim chỉ vào giữa ô (sliceDeg / 2)
          // Trừ đi vì canvas quay theo chiều kim đồng hồ, hệ tọa độ ngược
          const stopAngle =
            360 * 8 + (360 - targetIndex * sliceDeg - sliceDeg / 2);

          // Cộng dồn vào góc quay hiện tại để quay tiếp chứ ko reset
          this.rotation += stopAngle;
          this.canvas.style.transform = `rotate(${this.rotation}deg)`;

          // Hết thời gian quay (8s khớp css transition)
          setTimeout(async () => {
            await this.finishSpin(prizeMoney);
          }, 8000);
        },

        // Bước 3: Xử lý kết quả
        async finishSpin(money) {
          // Update tiền lên server
          try {
            await fetch(`${API_URL}/${this.user.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ money: money }),
            });
          } catch (e) {
            console.error('Lỗi save tiền', e);
          }

          // Hiệu ứng pháo hoa
          confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#ffd700', '#c62828'],
          });

          // Show kết quả
          document.getElementById('step-2').style.display = 'none';
          document.getElementById('step-3').style.display = 'block';

          document.getElementById('congrats-text').innerHTML =
            `Chúc mừng <b>${this.user.name}</b><br>Đã trúng kèo lì xì: <span style="font-size: 1.5em">${money.toLocaleString()}đ</span>`;
        },

        // ADMIN: Login & View Data
        async openAdmin() {
          const { value: password } = await Swal.fire({
            title: 'Admin Access',
            input: 'password',
            inputPlaceholder: 'Nhập mật khẩu (1234)',
            background: '#fff',
            confirmButtonColor: '#c62828',
          });

          if (password === '1234') {
            // Hide tất cả, hiện admin panel
            document
              .querySelectorAll('.glass-panel > div')
              .forEach((d) => (d.style.display = 'none'));
            document.getElementById('admin-panel').style.display = 'block';
            this.loadAdminData();
          } else if (password) {
            Swal.fire('Sai pass!', 'Đừng hack nữa bạn ơi.', 'error');
          }
        },

        async loadAdminData() {
          const tbody = document.getElementById('admin-list');
          const totalEl = document.getElementById('admin-total');
          tbody.innerHTML = '<tr><td colspan="2">Đang tải...</td></tr>';

          try {
            const res = await fetch(API_URL);
            const data = await res.json();

            // Filter user rác (chưa quay) nếu muốn, ở đây tao lấy hết
            // Sắp xếp người mới nhất lên đầu
            const validData = data.sort((a, b) => b.id - a.id);

            let total = 0;
            let html = '';

            validData.forEach((u) => {
              const m = parseInt(u.money) || 0;
              total += m;
              html += `
                            <tr>
                                <td>${u.name} <small style="color:#aaa">(${u.id})</small></td>
                                <td style="color: var(--gold); font-weight:bold">${m.toLocaleString()}đ</td>
                            </tr>
                        `;
            });

            tbody.innerHTML =
              html || '<tr><td colspan="2">Chưa ai chơi cả :(</td></tr>';
            totalEl.innerHTML = `Tổng thu: ${total.toLocaleString()} VNĐ`;
          } catch (e) {
            tbody.innerHTML = '<tr><td colspan="2">Lỗi tải dữ liệu</td></tr>';
          }
        },
      };
    </script>
  </body>
</html>
